name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (OpenMP for XGBoost)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ api/ tests/ --output-format=github

      - name: Run data pipeline (reproducibility check)
        run: |
          python -m src.data.make_dataset
          python -m src.features.build_features

      - name: Train model
        run: python -m src.models.train_model

      - name: Evaluate model
        run: python -m src.models.evaluate_model

      - name: Run test suite
        run: pytest --tb=short

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: churn-model-py${{ matrix.python-version }}
          path: models/churn_model.joblib
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-prediction:ci .
